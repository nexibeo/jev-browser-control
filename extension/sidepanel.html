<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jev Browser Control</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon48.png" alt=""> Jev</div>
    <div class="row pills">
      <span class="pill" id="claude" title="Claude connects through the MCP server on this computer"><span class="dot"></span><span>Claude</span></span>
      <span class="pill" id="provider"><span class="dot"></span><span>…</span></span>
    </div>
  </header>

  <main>
    <form id="task" class="card">
      <label class="field" for="goal" style="margin-top:0">What should Jev do in this tab?</label>
      <textarea id="goal" rows="3" placeholder="e.g. Search Wikipedia for Ristretto and open the article" required></textarea>
      <details id="more">
        <summary>Details Jev may type</summary>
        <textarea id="details" rows="2" placeholder="Names, dates, addresses. Never passwords."></textarea>
      </details>
      <div class="row actions">
        <button class="btn primary grow" id="run" type="submit">Run</button>
        <button class="btn danger" id="stop" type="button" hidden>Stop</button>
      </div>
      <p class="hint" id="keyhint" hidden></p>
    </form>

    <section id="confirm" class="card confirm" hidden role="alertdialog" aria-labelledby="confirm-title">
      <h3 id="confirm-title">Allow this click?</h3>
      <p id="confirm-text"></p>
      <div class="row">
        <button class="btn primary grow" id="allow">Allow once</button>
        <button class="btn" id="deny">Stop</button>
      </div>
    </section>

    <section aria-live="polite">
      <ol id="log" class="log"></ol>
      <div id="result" class="card result" hidden></div>
    </section>

    <section id="empty" class="empty">
      <p><strong>Two ways to use it</strong></p>
      <p>Type a goal above and Jev drives this tab, one decision about every half second.</p>
      <p>Or connect Claude: Claude plans, and hands fast browser work to Jev. <a href="options.html#claude" target="_blank">Set up Claude</a></p>
    </section>
  </main>

  <footer class="bottom">
    <a href="options.html" target="_blank">Settings</a>
    <span>·</span>
    <a href="https://jevbrowsercontrol.com/docs" target="_blank" rel="noopener">Docs</a>
    <span class="grow"></span>
    <span id="cost" class="mono"></span>
  </footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
